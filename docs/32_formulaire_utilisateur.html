<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANaTT - Formulaire Utilisateur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{anatt:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',500:'#22c55e',600:'#009639',700:'#007a2f',800:'#005f24',900:'#004a1c'},gold:{400:'#facc15',500:'#FCD116',600:'#d4a90e'},danger:{500:'#EF3340',600:'#dc2626'}},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
    <style>.sidebar-link{transition:all .2s}.sidebar-link:hover{background:rgba(255,255,255,.1);transform:translateX(4px)}.sidebar-link.active{background:rgba(255,255,255,.15);border-right:3px solid #FCD116}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn .5s ease-out both}.role-card{transition:all .2s;cursor:pointer}.role-card:hover{border-color:#009639}.role-card.selected{border-color:#009639;background:#f0fdf4}</style>
</head>
<body class="font-sans bg-gray-50 min-h-screen">
    <div class="fixed top-0 left-0 right-0 h-1 flex z-50"><div class="flex-1 bg-[#009639]"></div><div class="flex-1 bg-[#FCD116]"></div><div class="flex-1 bg-[#EF3340]"></div></div>
    <aside class="fixed top-1 left-0 bottom-0 w-64 bg-gradient-to-b from-anatt-800 to-anatt-900 text-white z-40 overflow-y-auto">
        <div class="p-5 border-b border-white/10"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-gold-500 rounded-xl flex items-center justify-center"><i class="fas fa-bus-alt text-anatt-900 text-lg"></i></div><div><h2 class="font-bold text-sm">ANaTT</h2><p class="text-[10px] text-anatt-200">Paiements Missions</p></div></div></div>
        <nav class="p-3 space-y-1">
            <p class="text-[10px] uppercase tracking-wider text-anatt-200/60 px-3 py-2 font-semibold">Principal</p>
            <a href="04_dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-anatt-100"><i class="fas fa-th-large w-5 text-center"></i>Tableau de bord</a>
            <p class="text-[10px] uppercase tracking-wider text-anatt-200/60 px-3 py-2 mt-3 font-semibold">Système</p>
            <a href="31_gestion_utilisateurs.html" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm"><i class="fas fa-user-shield w-5 text-center"></i>Utilisateurs</a>
            <a href="34_parametres.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-anatt-100"><i class="fas fa-cog w-5 text-center"></i>Paramètres</a>
        </nav>
        <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-white/10 bg-anatt-900/50"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-anatt-600 rounded-lg flex items-center justify-center text-sm font-bold">GA</div><div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">Gislain A.</p><p class="text-[10px] text-anatt-200">Super Admin</p></div><a href="01_login.html" class="text-anatt-200 hover:text-white"><i class="fas fa-sign-out-alt"></i></a></div></div>
    </aside>

    <main class="ml-64 pt-1 min-h-screen">
        <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-1 z-30">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <a href="31_gestion_utilisateurs.html" class="w-9 h-9 flex items-center justify-center rounded-xl border border-gray-200 hover:bg-gray-50 text-gray-500"><i class="fas fa-arrow-left text-sm"></i></a>
                    <div><h1 class="text-lg font-bold text-gray-800">Nouvel Utilisateur</h1><p class="text-xs text-gray-500">Créer un nouveau compte d'accès au système</p></div>
                </div>
            </div>
        </header>

        <div class="p-6 max-w-3xl mx-auto">
            <!-- Personal Info -->
            <div class="bg-white rounded-2xl border border-gray-100 p-6 mb-6 fade-in">
                <h3 class="text-base font-bold text-gray-800 mb-5"><i class="fas fa-user mr-2 text-anatt-600"></i>Informations personnelles</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">Nom <span class="text-red-500">*</span></label>
                        <input type="text" placeholder="Nom de famille" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-anatt-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">Prénom(s) <span class="text-red-500">*</span></label>
                        <input type="text" placeholder="Prénom(s)" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-anatt-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">Email professionnel <span class="text-red-500">*</span></label>
                        <input type="email" placeholder="prenom.nom@anatt.bj" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-anatt-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">Téléphone</label>
                        <input type="tel" placeholder="+229 XX XX XX XX" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-anatt-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">Direction</label>
                        <select class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-700 outline-none">
                            <option value="">Sélectionner...</option><option>Direction Générale</option><option>Direction Technique</option><option>Direction Administrative</option><option>Direction Financière</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">Fonction</label>
                        <input type="text" placeholder="Intitulé du poste" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-anatt-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Role Selection -->
            <div class="bg-white rounded-2xl border border-gray-100 p-6 mb-6 fade-in" style="animation-delay:.1s">
                <h3 class="text-base font-bold text-gray-800 mb-5"><i class="fas fa-shield-alt mr-2 text-anatt-600"></i>Rôle et permissions</h3>
                <div class="grid grid-cols-2 gap-3">
                    <label class="role-card border-2 border-gray-200 rounded-xl p-4 flex items-start gap-3">
                        <input type="radio" name="role" class="mt-1">
                        <div>
                            <p class="text-sm font-bold text-gray-800">Super Admin</p>
                            <p class="text-[11px] text-gray-500 mt-0.5">Accès complet au système, gestion des utilisateurs et configuration</p>
                            <div class="flex flex-wrap gap-1 mt-2">
                                <span class="px-1.5 py-0.5 bg-red-100 text-red-600 text-[9px] font-semibold rounded">Tout</span>
                            </div>
                        </div>
                    </label>
                    <label class="role-card border-2 border-gray-200 rounded-xl p-4 flex items-start gap-3">
                        <input type="radio" name="role" class="mt-1">
                        <div>
                            <p class="text-sm font-bold text-gray-800">Administrateur</p>
                            <p class="text-[11px] text-gray-500 mt-0.5">Gestion des données et des rapports, sans accès admin système</p>
                            <div class="flex flex-wrap gap-1 mt-2">
                                <span class="px-1.5 py-0.5 bg-blue-100 text-blue-600 text-[9px] font-semibold rounded">Personnel</span>
                                <span class="px-1.5 py-0.5 bg-blue-100 text-blue-600 text-[9px] font-semibold rounded">Missions</span>
                                <span class="px-1.5 py-0.5 bg-blue-100 text-blue-600 text-[9px] font-semibold rounded">Paiements</span>
                                <span class="px-1.5 py-0.5 bg-blue-100 text-blue-600 text-[9px] font-semibold rounded">Rapports</span>
                            </div>
                        </div>
                    </label>
                    <label class="role-card selected border-2 border-anatt-600 bg-anatt-50 rounded-xl p-4 flex items-start gap-3">
                        <input type="radio" name="role" checked class="mt-1">
                        <div>
                            <p class="text-sm font-bold text-gray-800">Validateur</p>
                            <p class="text-[11px] text-gray-500 mt-0.5">Validation des ordres de mission et des lots de paiement</p>
                            <div class="flex flex-wrap gap-1 mt-2">
                                <span class="px-1.5 py-0.5 bg-green-100 text-green-600 text-[9px] font-semibold rounded">Missions (lecture)</span>
                                <span class="px-1.5 py-0.5 bg-green-100 text-green-600 text-[9px] font-semibold rounded">Validation</span>
                                <span class="px-1.5 py-0.5 bg-green-100 text-green-600 text-[9px] font-semibold rounded">Rapports</span>
                            </div>
                        </div>
                    </label>
                    <label class="role-card border-2 border-gray-200 rounded-xl p-4 flex items-start gap-3">
                        <input type="radio" name="role" class="mt-1">
                        <div>
                            <p class="text-sm font-bold text-gray-800">Gestionnaire</p>
                            <p class="text-[11px] text-gray-500 mt-0.5">Saisie et gestion des missions et du personnel</p>
                            <div class="flex flex-wrap gap-1 mt-2">
                                <span class="px-1.5 py-0.5 bg-amber-100 text-amber-600 text-[9px] font-semibold rounded">Personnel</span>
                                <span class="px-1.5 py-0.5 bg-amber-100 text-amber-600 text-[9px] font-semibold rounded">Missions</span>
                                <span class="px-1.5 py-0.5 bg-amber-100 text-amber-600 text-[9px] font-semibold rounded">Barèmes (lecture)</span>
                            </div>
                        </div>
                    </label>
                    <label class="role-card border-2 border-gray-200 rounded-xl p-4 flex items-start gap-3 col-span-2">
                        <input type="radio" name="role" class="mt-1">
                        <div>
                            <p class="text-sm font-bold text-gray-800">Lecteur</p>
                            <p class="text-[11px] text-gray-500 mt-0.5">Consultation uniquement, aucune modification possible</p>
                            <div class="flex flex-wrap gap-1 mt-2">
                                <span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 text-[9px] font-semibold rounded">Dashboard</span>
                                <span class="px-1.5 py-0.5 bg-gray-100 text-gray-600 text-[9px] font-semibold rounded">Rapports (lecture)</span>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Security -->
            <div class="bg-white rounded-2xl border border-gray-100 p-6 mb-6 fade-in" style="animation-delay:.2s">
                <h3 class="text-base font-bold text-gray-800 mb-5"><i class="fas fa-lock mr-2 text-anatt-600"></i>Sécurité du compte</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1.5">Mot de passe initial <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <input type="password" value="P@ssw0rd2025!" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-anatt-500 outline-none pr-24">
                            <button class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-1 bg-gray-100 text-gray-600 rounded-lg text-xs hover:bg-gray-200"><i class="fas fa-random mr-1"></i>Générer</button>
                        </div>
                        <div class="flex items-center gap-4 mt-2">
                            <div class="flex items-center gap-1"><div class="w-8 h-1 bg-green-500 rounded"></div><div class="w-8 h-1 bg-green-500 rounded"></div><div class="w-8 h-1 bg-green-500 rounded"></div><div class="w-8 h-1 bg-green-500 rounded"></div></div>
                            <span class="text-[11px] text-green-600 font-medium">Fort</span>
                        </div>
                    </div>
                    <label class="flex items-center gap-3">
                        <input type="checkbox" checked class="w-4 h-4 text-anatt-600 rounded border-gray-300">
                        <span class="text-sm text-gray-700">Forcer le changement de mot de passe à la première connexion</span>
                    </label>
                    <label class="flex items-center gap-3">
                        <input type="checkbox" checked class="w-4 h-4 text-anatt-600 rounded border-gray-300">
                        <span class="text-sm text-gray-700">Envoyer les identifiants par email</span>
                    </label>
                    <label class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 text-anatt-600 rounded border-gray-300">
                        <span class="text-sm text-gray-700">Activer l'authentification à deux facteurs (2FA)</span>
                    </label>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-between fade-in" style="animation-delay:.3s">
                <a href="31_gestion_utilisateurs.html" class="px-5 py-3 border border-gray-200 rounded-xl text-sm font-semibold text-gray-700 hover:bg-gray-50">Annuler</a>
                <div class="flex items-center gap-3">
                    <button class="px-5 py-3 bg-white border border-anatt-200 text-anatt-700 rounded-xl text-sm font-semibold hover:bg-anatt-50">Enregistrer brouillon</button>
                    <button class="px-5 py-3 bg-anatt-600 text-white rounded-xl text-sm font-bold hover:bg-anatt-700 flex items-center gap-2 shadow-lg"><i class="fas fa-check"></i>Créer le compte</button>
                </div>
            </div>
        </div>
    </main>

    <script>
    document.querySelectorAll('.role-card').forEach(card => {
        card.addEventListener('click', function() {
            document.querySelectorAll('.role-card').forEach(c => { c.classList.remove('selected','border-anatt-600','bg-anatt-50'); c.classList.add('border-gray-200'); });
            this.classList.add('selected','border-anatt-600','bg-anatt-50');
            this.classList.remove('border-gray-200');
            this.querySelector('input[type=radio]').checked = true;
        });
    });
    </script>
</body>
</html>
