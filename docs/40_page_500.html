<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANaTT - Erreur serveur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{anatt:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',500:'#22c55e',600:'#009639',700:'#007a2f',800:'#005f24',900:'#004a1c'},gold:{400:'#facc15',500:'#FCD116',600:'#d4a90e'},danger:{500:'#EF3340',600:'#dc2626'}},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
    <style>
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn .6s ease-out both}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.float{animation:float 3s ease-in-out infinite}
    @keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.5)}40%{opacity:.6}100%{opacity:0;transform:translateY(-40px) scale(1.5)}}.smoke{animation:smoke 2s ease-out infinite}
    @keyframes wrench-spin{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(20deg)}90%{transform:rotate(-15deg)}}.wrench-spin{animation:wrench-spin 3s ease-in-out infinite}
    @keyframes spark{0%,100%{opacity:0}50%{opacity:1}}.spark{animation:spark .8s ease-in-out infinite}
    @keyframes gear-rotate{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.gear-rotate{animation:gear-rotate 6s linear infinite}
    </style>
</head>
<body class="font-sans bg-gray-50 min-h-screen flex flex-col">
    <div class="fixed top-0 left-0 right-0 h-1 flex z-50"><div class="flex-1 bg-[#009639]"></div><div class="flex-1 bg-[#FCD116]"></div><div class="flex-1 bg-[#EF3340]"></div></div>

    <div class="flex-1 flex items-center justify-center p-6 pt-8">
        <div class="text-center max-w-lg fade-in">
            
            <!-- Illustration SVG - Broken Bus with Smoke & Tools -->
            <div class="relative mb-8">
                <svg class="w-72 h-52 mx-auto float" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Road -->
                    <rect x="30" y="180" width="260" height="28" rx="4" fill="#e5e7eb"/>
                    <line x1="70" y1="194" x2="90" y2="194" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
                    <line x1="120" y1="194" x2="140" y2="194" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
                    <line x1="170" y1="194" x2="190" y2="194" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
                    <line x1="220" y1="194" x2="240" y2="194" stroke="#9ca3af" stroke-width="3" stroke-dasharray="10 10"/>
                    
                    <!-- Bus body - tilted/broken feel -->
                    <g transform="translate(90, 108) rotate(-3)">
                        <rect x="0" y="20" width="90" height="52" rx="8" fill="#009639"/>
                        <rect x="5" y="25" width="26" height="18" rx="3" fill="#bbf7d0"/>
                        <rect x="36" y="25" width="26" height="18" rx="3" fill="#bbf7d0"/>
                        <!-- Cracked window -->
                        <line x1="40" y1="28" x2="50" y2="38" stroke="#007a2f" stroke-width="1.5"/>
                        <line x1="48" y1="30" x2="42" y2="36" stroke="#007a2f" stroke-width="1"/>
                        <rect x="68" y="25" width="16" height="18" rx="2" fill="#FCD116"/>
                        <!-- Wheels -->
                        <circle cx="20" cy="74" r="9" fill="#374151"/>
                        <circle cx="20" cy="74" r="4.5" fill="#6b7280"/>
                        <circle cx="68" cy="74" r="9" fill="#374151"/>
                        <circle cx="68" cy="74" r="4.5" fill="#6b7280"/>
                        <!-- Hood open -->
                        <path d="M-5 20 L-5 5 L25 5 L25 20" stroke="#007a2f" stroke-width="2" fill="#009639" opacity="0.7"/>
                    </g>
                    
                    <!-- Smoke puffs -->
                    <circle cx="105" cy="105" r="8" fill="#9ca3af" opacity="0.3" class="smoke"/>
                    <circle cx="115" cy="100" r="6" fill="#9ca3af" opacity="0.25" class="smoke" style="animation-delay:.4s"/>
                    <circle cx="95" cy="108" r="10" fill="#9ca3af" opacity="0.2" class="smoke" style="animation-delay:.8s"/>
                    
                    <!-- Sparks near engine -->
                    <circle cx="100" cy="125" r="2" fill="#FCD116" class="spark"/>
                    <circle cx="108" cy="120" r="1.5" fill="#EF3340" class="spark" style="animation-delay:.3s"/>
                    <circle cx="95" cy="118" r="1.5" fill="#FCD116" class="spark" style="animation-delay:.6s"/>
                    
                    <!-- Wrench tool on ground -->
                    <g transform="translate(210, 160)" class="wrench-spin" style="transform-origin:220px 170px">
                        <rect x="0" y="5" width="28" height="5" rx="2" fill="#6b7280"/>
                        <circle cx="0" cy="7" r="7" fill="none" stroke="#6b7280" stroke-width="3"/>
                        <rect x="26" y="2" width="8" height="11" rx="2" fill="#6b7280"/>
                    </g>
                    
                    <!-- Gear spinning -->
                    <g transform="translate(55, 50)" class="gear-rotate" style="transform-origin:55px 50px">
                        <circle cx="0" cy="0" r="12" fill="none" stroke="#d1d5db" stroke-width="3"/>
                        <circle cx="0" cy="0" r="5" fill="#d1d5db"/>
                        <rect x="-2" y="-16" width="4" height="8" rx="1" fill="#d1d5db"/>
                        <rect x="-2" y="8" width="4" height="8" rx="1" fill="#d1d5db"/>
                        <rect x="-16" y="-2" width="8" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="8" y="-2" width="8" height="4" rx="1" fill="#d1d5db"/>
                    </g>
                    
                    <!-- Another small gear -->
                    <g transform="translate(255, 65)" class="gear-rotate" style="transform-origin:255px 65px;animation-direction:reverse;animation-duration:4s">
                        <circle cx="0" cy="0" r="9" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
                        <circle cx="0" cy="0" r="4" fill="#e5e7eb"/>
                        <rect x="-1.5" y="-12" width="3" height="6" rx="1" fill="#e5e7eb"/>
                        <rect x="-1.5" y="6" width="3" height="6" rx="1" fill="#e5e7eb"/>
                        <rect x="-12" y="-1.5" width="6" height="3" rx="1" fill="#e5e7eb"/>
                        <rect x="6" y="-1.5" width="6" height="3" rx="1" fill="#e5e7eb"/>
                    </g>

                    <!-- Warning triangle -->
                    <g transform="translate(225, 140)">
                        <path d="M12 0 L24 20 L0 20 Z" fill="#FCD116" stroke="#d4a90e" stroke-width="1.5"/>
                        <text x="12" y="16" fill="#92400e" font-size="12" font-weight="800" text-anchor="middle">!</text>
                    </g>
                </svg>
            </div>

            <!-- Error Code -->
            <div class="flex items-center justify-center gap-2 mb-4">
                <span class="text-7xl font-extrabold text-gray-700">5</span>
                <div class="w-14 h-14 bg-danger-500 rounded-full flex items-center justify-center shadow-lg shadow-danger-500/30">
                    <i class="fas fa-tools text-white text-xl"></i>
                </div>
                <span class="text-7xl font-extrabold text-gray-700">0</span>
            </div>

            <h1 class="text-2xl font-extrabold text-gray-800 mb-3">Erreur serveur</h1>
            <p class="text-gray-500 mb-8 max-w-sm mx-auto">Le moteur a calé ! Notre serveur rencontre un problème temporaire. Nos techniciens sont déjà sur le coup.</p>

            <!-- Suggestion Cards -->
            <div class="grid grid-cols-3 gap-3 mb-8 max-w-md mx-auto fade-in" style="animation-delay:.2s">
                <button onclick="location.reload()" class="bg-white border border-gray-100 rounded-xl p-4 hover:border-anatt-200 hover:shadow-md transition-all group">
                    <div class="w-10 h-10 bg-anatt-50 rounded-lg flex items-center justify-center mx-auto mb-2 group-hover:bg-anatt-100 transition-colors">
                        <i class="fas fa-redo text-anatt-600"></i>
                    </div>
                    <p class="text-xs font-semibold text-gray-700">Réessayer</p>
                </button>
                <a href="02_dashboard.html" class="bg-white border border-gray-100 rounded-xl p-4 hover:border-gold-500 hover:shadow-md transition-all group">
                    <div class="w-10 h-10 bg-amber-50 rounded-lg flex items-center justify-center mx-auto mb-2 group-hover:bg-amber-100 transition-colors">
                        <i class="fas fa-chart-pie text-amber-600"></i>
                    </div>
                    <p class="text-xs font-semibold text-gray-700">Dashboard</p>
                </a>
                <a href="mailto:support@anatt.bj" class="bg-white border border-gray-100 rounded-xl p-4 hover:border-blue-200 hover:shadow-md transition-all group">
                    <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center mx-auto mb-2 group-hover:bg-blue-100 transition-colors">
                        <i class="fas fa-headset text-blue-600"></i>
                    </div>
                    <p class="text-xs font-semibold text-gray-700">Support</p>
                </a>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-center gap-4 fade-in" style="animation-delay:.3s">
                <button onclick="history.back()" class="px-5 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm font-semibold hover:bg-gray-100 transition-colors"><i class="fas fa-arrow-left mr-2"></i>Page précédente</button>
                <button onclick="location.reload()" class="px-5 py-2.5 bg-anatt-600 text-white rounded-xl text-sm font-semibold hover:bg-anatt-700 transition-colors shadow-lg shadow-anatt-600/20"><i class="fas fa-sync-alt mr-2"></i>Actualiser la page</button>
            </div>

            <!-- Status Info -->
            <div class="mt-8 inline-flex items-center gap-2 bg-amber-50 border border-amber-100 rounded-full px-4 py-2 fade-in" style="animation-delay:.4s">
                <span class="w-2 h-2 bg-amber-400 rounded-full animate-pulse"></span>
                <span class="text-xs text-amber-700 font-medium">Incident en cours de résolution</span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6">
        <div class="flex items-center justify-center gap-2 text-gray-400 text-xs">
            <div class="w-6 h-6 bg-gold-500 rounded-md flex items-center justify-center"><i class="fas fa-bus-alt text-anatt-900 text-[9px]"></i></div>
            <span>ANaTT · Agence Nationale des Transports Terrestres</span>
        </div>
    </footer>
</body>
</html>
