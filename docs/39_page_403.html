<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANaTT - Accès interdit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{anatt:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',500:'#22c55e',600:'#009639',700:'#007a2f',800:'#005f24',900:'#004a1c'},gold:{400:'#facc15',500:'#FCD116',600:'#d4a90e'},danger:{500:'#EF3340',600:'#dc2626'}},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
    <style>
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn .6s ease-out both}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}.float{animation:float 3s ease-in-out infinite}
    @keyframes pulse-ring{0%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:0}100%{transform:scale(.8);opacity:0}}.pulse-ring{animation:pulse-ring 2s ease-out infinite}
    @keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}75%{transform:rotate(0)}}.shake{animation:shake 3s ease-in-out infinite;animation-delay:1s}
    @keyframes scanline{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(60px);opacity:0}}.scanline{animation:scanline 2.5s ease-in-out infinite}
    </style>
</head>
<body class="font-sans bg-gray-50 min-h-screen flex flex-col">
    <div class="fixed top-0 left-0 right-0 h-1 flex z-50"><div class="flex-1 bg-[#009639]"></div><div class="flex-1 bg-[#FCD116]"></div><div class="flex-1 bg-[#EF3340]"></div></div>

    <div class="flex-1 flex items-center justify-center p-6 pt-8">
        <div class="text-center max-w-lg fade-in">
            
            <!-- Illustration SVG - Shield & Lock -->
            <div class="relative mb-8">
                <svg class="w-64 h-48 mx-auto float" viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Pulse ring behind shield -->
                    <circle cx="150" cy="100" r="70" stroke="#EF3340" stroke-width="2" opacity="0.3" class="pulse-ring"/>
                    <circle cx="150" cy="100" r="55" stroke="#EF3340" stroke-width="1.5" opacity="0.2" class="pulse-ring" style="animation-delay:.5s"/>
                    
                    <!-- Shield shape -->
                    <path d="M150 30 L210 55 L210 110 C210 155 180 185 150 195 C120 185 90 155 90 110 L90 55 Z" fill="#009639" opacity="0.1" stroke="#009639" stroke-width="2.5"/>
                    <path d="M150 42 L200 62 L200 108 C200 145 175 170 150 180 C125 170 100 145 100 108 L100 62 Z" fill="#009639" opacity="0.15"/>
                    
                    <!-- Lock body -->
                    <g class="shake">
                        <rect x="128" y="95" width="44" height="36" rx="6" fill="#EF3340"/>
                        <rect x="131" y="98" width="38" height="30" rx="4" fill="#dc2626"/>
                        <!-- Lock shackle -->
                        <path d="M137 95 L137 80 C137 69 143 62 150 62 C157 62 163 69 163 80 L163 95" stroke="#EF3340" stroke-width="6" stroke-linecap="round" fill="none"/>
                        <!-- Keyhole -->
                        <circle cx="150" cy="110" r="5" fill="#fecaca"/>
                        <rect x="148" y="112" width="4" height="8" rx="1" fill="#fecaca"/>
                    </g>
                    
                    <!-- Scan line effect on shield -->
                    <rect x="95" y="50" width="110" height="3" rx="1" fill="#EF3340" opacity="0.4" class="scanline"/>
                    
                    <!-- Decorative X marks -->
                    <g transform="translate(55, 55)" opacity="0.5">
                        <line x1="0" y1="0" x2="14" y2="14" stroke="#EF3340" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="14" y1="0" x2="0" y2="14" stroke="#EF3340" stroke-width="2.5" stroke-linecap="round"/>
                    </g>
                    <g transform="translate(235, 70)" opacity="0.4">
                        <line x1="0" y1="0" x2="12" y2="12" stroke="#EF3340" stroke-width="2" stroke-linecap="round"/>
                        <line x1="12" y1="0" x2="0" y2="12" stroke="#EF3340" stroke-width="2" stroke-linecap="round"/>
                    </g>
                    <g transform="translate(70, 170)" opacity="0.3">
                        <line x1="0" y1="0" x2="10" y2="10" stroke="#FCD116" stroke-width="2" stroke-linecap="round"/>
                        <line x1="10" y1="0" x2="0" y2="10" stroke="#FCD116" stroke-width="2" stroke-linecap="round"/>
                    </g>

                    <!-- Small shield badges -->
                    <g transform="translate(50, 130)" opacity="0.4">
                        <path d="M8 0 L16 4 L16 10 C16 14 12 17 8 18 C4 17 0 14 0 10 L0 4 Z" fill="#009639"/>
                    </g>
                    <g transform="translate(240, 140)" opacity="0.3">
                        <path d="M6 0 L12 3 L12 8 C12 11 9 13 6 14 C3 13 0 11 0 8 L0 3 Z" fill="#FCD116"/>
                    </g>
                </svg>
            </div>

            <!-- Error Code -->
            <div class="flex items-center justify-center gap-2 mb-4">
                <span class="text-7xl font-extrabold text-danger-500">4</span>
                <div class="w-14 h-14 bg-danger-500 rounded-full flex items-center justify-center shadow-lg shadow-danger-500/30">
                    <i class="fas fa-lock text-white text-xl"></i>
                </div>
                <span class="text-7xl font-extrabold text-danger-500">3</span>
            </div>

            <h1 class="text-2xl font-extrabold text-gray-800 mb-3">Accès interdit</h1>
            <p class="text-gray-500 mb-8 max-w-sm mx-auto">Ce secteur est verrouillé ! Vous n'avez pas les permissions nécessaires pour accéder à cette ressource.</p>

            <!-- Suggestion Cards -->
            <div class="grid grid-cols-3 gap-3 mb-8 max-w-md mx-auto fade-in" style="animation-delay:.2s">
                <a href="02_dashboard.html" class="bg-white border border-gray-100 rounded-xl p-4 hover:border-anatt-200 hover:shadow-md transition-all group">
                    <div class="w-10 h-10 bg-anatt-50 rounded-lg flex items-center justify-center mx-auto mb-2 group-hover:bg-anatt-100 transition-colors">
                        <i class="fas fa-chart-pie text-anatt-600"></i>
                    </div>
                    <p class="text-xs font-semibold text-gray-700">Dashboard</p>
                </a>
                <a href="01_login.html" class="bg-white border border-gray-100 rounded-xl p-4 hover:border-gold-500 hover:shadow-md transition-all group">
                    <div class="w-10 h-10 bg-amber-50 rounded-lg flex items-center justify-center mx-auto mb-2 group-hover:bg-amber-100 transition-colors">
                        <i class="fas fa-sign-in-alt text-amber-600"></i>
                    </div>
                    <p class="text-xs font-semibold text-gray-700">Connexion</p>
                </a>
                <a href="mailto:support@anatt.bj" class="bg-white border border-gray-100 rounded-xl p-4 hover:border-blue-200 hover:shadow-md transition-all group">
                    <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center mx-auto mb-2 group-hover:bg-blue-100 transition-colors">
                        <i class="fas fa-headset text-blue-600"></i>
                    </div>
                    <p class="text-xs font-semibold text-gray-700">Support</p>
                </a>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-center gap-4 fade-in" style="animation-delay:.3s">
                <button onclick="history.back()" class="px-5 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm font-semibold hover:bg-gray-100 transition-colors"><i class="fas fa-arrow-left mr-2"></i>Page précédente</button>
                <a href="02_dashboard.html" class="px-5 py-2.5 bg-anatt-600 text-white rounded-xl text-sm font-semibold hover:bg-anatt-700 transition-colors shadow-lg shadow-anatt-600/20"><i class="fas fa-home mr-2"></i>Retour à l'accueil</a>
            </div>

            <!-- Permission Info -->
            <div class="mt-8 inline-flex items-center gap-2 bg-red-50 border border-red-100 rounded-full px-4 py-2 fade-in" style="animation-delay:.4s">
                <i class="fas fa-shield-alt text-danger-500 text-xs"></i>
                <span class="text-xs text-danger-500 font-medium">Permission requise : administrateur</span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6">
        <div class="flex items-center justify-center gap-2 text-gray-400 text-xs">
            <div class="w-6 h-6 bg-gold-500 rounded-md flex items-center justify-center"><i class="fas fa-bus-alt text-anatt-900 text-[9px]"></i></div>
            <span>ANaTT · Agence Nationale des Transports Terrestres</span>
        </div>
    </footer>
</body>
</html>
