name: CI

# Bloque le merge d'une PR ou d'un push sur main dès qu'un test casse.
# Sept jobs : Lint, Pest (SQLite), Pest MySQL, Vitest + type-check, Playwright,
# Recette · API réelle (scripts/recette/) et build du SPA (artefact frontend-dist).
# Les deux premiers garde-fous (Pest et Vitest) sont issus de l'incident du 30/07 où un merge silencieux
# avait écrasé `normaliserErreurBlob` et le garde-fou `etat.statut` : les tests
# existaient déjà, il ne leur manquait qu'un CI pour être exécutés à chaque PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule un run précédent quand un nouveau commit est poussé sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style de code : Laravel Pint (backend) + ESLint/oxlint (frontend), en mode
  # VÉRIFICATION (aucun --fix). Empêche la dérive de style de repasser au merge.
  lint:
    name: Lint · Pint + ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, bcmath, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Pint (check only)
        working-directory: backend
        run: vendor/bin/pint --test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint + oxlint (check only)
        working-directory: frontend
        run: npm run lint:check

  backend:
    name: Backend · Pest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock épingle des paquets PHP >= 8.4 (symfony 8, spatie
          # activitylog 5) : le CI doit suivre la même version que le poste
          # de dev (WAMP PHP 8.4), sinon composer install échoue.
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, bcmath, gd, zip
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run Pest
        # phpunit.xml force sqlite ":memory:" en env `testing` : rien à provisionner.
        run: vendor/bin/pest --colors=always

  # Ce que SQLite ne sait pas prouver : aller-retour réel db:backup / db:restore
  # (binaires mysqldump / mysql, défauts n° 10 et 14) et verrou lockForUpdate de
  # l'amendement (InnoDB). Seul le groupe « mysql » (tests/Mysql) est exécuté ;
  # ces tests sont ignorés par le job « Backend · Pest » (SQLite).
  backend-mysql:
    name: Backend · Pest MySQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # Le nom doit contenir « test » (garde-fou de tests/Support/MysqlReel.php).
          MYSQL_DATABASE: anatt_test_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: anatt_test_mysql
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DUMP_BINARY: mysqldump
      DB_RESTORE_BINARY: mysql

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, sqlite3, pdo_sqlite, intl, bcmath, gd, zip
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Client MySQL (mysqldump / mysql)
        run: |
          if ! command -v mysqldump >/dev/null || ! command -v mysql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends default-mysql-client
          fi
          mysqldump --version
          mysql --version

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run Pest (groupe mysql)
        # Les variables DB_* du job priment sur les <env> de phpunit.xml (non forcées).
        run: vendor/bin/pest --group=mysql --colors=always

  # Recette de bout en bout contre l'API Laravel RÉELLEMENT servie (php artisan serve),
  # sur une base SQLite neuve seedée (comptes de démonstration) : rejeu de
  # docs/SCENARIO-DEMO.md puis contrôles transverses (RBAC, fichiers téléchargés,
  # idempotence, régularisations…). Cf. scripts/recette/README.md.
  recette:
    name: Recette · API réelle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, intl, bcmath, gd, zip
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `php artisan serve` ne transmet pas les variables d'environnement au serveur
      # quand un .env existe : la configuration de recette est donc écrite dans le .env.
      - name: Prepare environment (SQLite neuve, file sync)
        run: |
          cp .env.example .env
          sed -i \
            -e 's#^DB_CONNECTION=.*#DB_CONNECTION=sqlite#' \
            -e "s#^DB_DATABASE=.*#DB_DATABASE=${RUNNER_TEMP}/recette.sqlite#" \
            -e 's#^QUEUE_CONNECTION=.*#QUEUE_CONNECTION=sync#' \
            -e 's#^CACHE_STORE=.*#CACHE_STORE=file#' \
            -e 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' \
            .env
          php artisan key:generate --ansi
          touch "${RUNNER_TEMP}/recette.sqlite"
          php artisan migrate:fresh --seed --force

      - name: Start API
        run: |
          QUEUE_CONNECTION=sync nohup php artisan serve --host=127.0.0.1 --port=8000 > "${RUNNER_TEMP}/serve.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/up > /dev/null; then echo "API prête"; exit 0; fi
            sleep 1
          done
          echo "L'API ne répond pas" ; cat "${RUNNER_TEMP}/serve.log" ; exit 1

      - name: Rejeu du scénario de démonstration
        working-directory: .
        env:
          API_URL: http://127.0.0.1:8000
        run: node scripts/recette/rejeu-scenario.cjs

      - name: Recette API transverse
        working-directory: .
        env:
          API_URL: http://127.0.0.1:8000
        run: node scripts/recette/recette-api.cjs

      - name: Server logs (on failure)
        if: ${{ failure() }}
        run: |
          cat "${RUNNER_TEMP}/serve.log" || true
          tail -n 200 storage/logs/laravel.log || true
  frontend:
    name: Frontend · Vitest + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Bloque les régressions TypeScript (ex. import d'une fonction supprimée
        # au merge — le symptôme initial de l'incident du 30/07).
        run: npm run type-check

      - name: Run Vitest
        run: npm run test:unit -- --run --reporter=default

  e2e:
    name: Frontend · Playwright (parcours critique)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # L'API est mockée dans le test (page.route) : aucun backend à démarrer.
      # Seul Chromium est nécessaire — on n'installe donc que lui (rapide, robuste).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Le serveur de prévisualisation (playwright.config webServer) sert dist/.
      - name: Build frontend
        run: npm run build

      - name: Run Playwright
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Build de production du SPA, publié en ARTEFACT téléchargeable (frontend-dist).
  # dist/ n'est plus versionné : pour un déploiement FTP sans build local, on
  # récupère cet artefact depuis le run CI de main (contenu à déposer dans
  # public_html/). Cf. DEPLOY-CPANEL.md.
  dist:
    name: Frontend · Build dist (artefact déployable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30
